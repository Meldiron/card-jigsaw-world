name: Release to TestFlight

# Started by hand (tools/dev/testflight.sh or the Actions tab). Builds a signed
# archive and uploads it to App Store Connect as a TestFlight build of the
# version in pubspec.yaml (or the `version` input). Apple reviews the first
# build of a version for external testers; later builds of the same version
# reach them without another review, so the version string changes only when
# a new App Store release cycle starts (tools/dev/release.sh). Build number =
# 100 + run number.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.6.0); defaults to pubspec"
        required: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KEYCHAIN: build.keychain-db
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then V="$INPUT"; else V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//'); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Build numbers must only ever go up for a version. Offset the run
          # number so CI builds always sit above builds uploaded by hand.
          B=$((100 + ${{ github.run_number }}))
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "Version $V build $B"

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Import distribution certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_P12 }}" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm /tmp/dist.p12

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare Xcode build settings
        run: flutter build ios --config-only --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build }}

      - name: Install App Store profiles and switch to manual signing
        # The API key cannot use Xcode cloud signing, so the archive is signed
        # with the imported Apple Distribution certificate and the App Store
        # profiles created in the developer portal (tools/store/install_profiles.py
        # downloads them; tools/store/ci_manual_signing.py points the Release
        # configurations at them). The repo keeps automatic signing for local builds.
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          python3 -m pip install -q --user --break-system-packages pyjwt cryptography
          ASC_KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8 python3 tools/store/install_profiles.py
          python3 tools/store/ci_manual_signing.py

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive 2>&1 | grep -E "error:|warning: .*(sign|profile)|ARCHIVE (SUCCEEDED|FAILED)|^\*\*" || true
          test -d build/Runner.xcarchive/Products/Applications/Runner.app

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa
          ls -la build/ipa

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Add to TestFlight group and submit for beta review
        # Waits for Apple to process the build, marks it export-compliant,
        # writes store/metadata/en-US/release_notes.txt as "what to test", adds
        # the build to the internal and public groups and submits it to Beta
        # App Review when this version has no approved build yet.
        timeout-minutes: 45
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          python3 -m pip install -q --user --break-system-packages pyjwt cryptography requests
          ASC_KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8 python3 tools/store/asc_publish.py testflight \
            --build ${{ steps.ver.outputs.build }} \
            --whats-new-file store/metadata/en-US/release_notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: build/ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
