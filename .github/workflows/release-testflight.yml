name: Release to TestFlight

# Publishing a GitHub release (tag like v1.6.0) builds a signed iOS archive
# and uploads it to TestFlight. Version = tag, build number = run number.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.6.0); defaults to pubspec"
        required: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEYCHAIN: build.keychain-db
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then V="$INPUT"; elif [ -n "$TAG" ]; then V="${TAG#v}"; else V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//'); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $V build ${{ github.run_number }}"

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Import distribution certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_P12 }}" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm /tmp/dist.p12

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare Xcode build settings
        run: flutter build ios --config-only --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build }}

      - name: Archive (Xcode manages App Store profiles with the API key)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            archive | xcpretty || (echo "archive failed" && exit 1)

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ls -la build/ipa

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: build/ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
