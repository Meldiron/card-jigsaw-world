<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `$FLUTTER_BASE_HREF` is replaced by `flutter build web --base-href /`
    (and defaults to "/" when the flag is omitted), giving <base href="/">.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Carden, your calm picture puzzle. Swap cards until the picture is whole, with a new puzzle every day.">
  <meta name="theme-color" content="#2F4FBF">
  <meta name="color-scheme" content="light dark">

  <!-- Installed / home-screen presentation -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carden">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Social preview. Messages and WhatsApp read these tags only (no script runs), so every link of
       the site, a Play together invite included, shows the same card: web/invite-card.jpg, 1200 x 630
       (iMessage wants 900 px or wider, WhatsApp under 600 KB), made by tools/brand/invite_card.py. -->
  <meta property="og:title" content="Carden: Your calm picture puzzle">
  <meta property="og:description" content="Swap cards until the picture is whole, on your own or together. A new puzzle every day.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carden">
  <meta property="og:url" content="https://play.carden.page/">
  <meta property="og:image" content="https://play.carden.page/invite-card.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A picture dealt as cards beside the name Carden">
  <meta name="twitter:card" content="summary_large_image">

  <title>Carden: Your calm picture puzzle</title>

  <style>
    :root {
      --canvas: #F6F6F8;
      --ink: #111118;
      --ink-secondary: #5F5F6E;
      --accent: #2F4FBF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0D0D11;
        --ink: #F2F2F5;
        --ink-secondary: #A6A6B4;
        --accent: #7C9AFF;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--canvas);
      color: var(--ink);
      /* System font stack for the loader; Flutter text uses the engine's own fonts. */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    /* Loading splash: shown until Flutter paints its first frame. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--canvas);
      transition: opacity 220ms ease-out;
      z-index: 1;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 1px 0 rgba(16, 16, 32, 0.06), 0 8px 24px rgba(16, 16, 32, 0.08);
    }
    #splash h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    #splash p {
      margin: 0;
      font-size: 13px;
      color: var(--ink-secondary);
    }
    #splash .bar {
      width: 120px;
      height: 3px;
      border-radius: 999px;
      background: rgba(127, 127, 140, 0.18);
      overflow: hidden;
    }
    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite alternate;
    }
    @keyframes slide {
      from { transform: translateX(-20%); }
      to { transform: translateX(170%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; }
    }
    noscript p { padding: 24px; text-align: center; }

    /* Play together invite on an iPhone or iPad (see the script below): open it in the app, or play
       here. Shown before the game loads, so an in-app browser does not load the game for nothing. */
    #invite {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--canvas);
    }
    #invite[hidden] { display: none; }
    #invite .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    #invite img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      box-shadow: 0 1px 0 rgba(16, 16, 32, 0.06), 0 8px 24px rgba(16, 16, 32, 0.08);
      margin-bottom: 8px;
    }
    #invite h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    #invite p { margin: 0 0 12px; font-size: 15px; line-height: 1.4; color: var(--ink-secondary); }
    #invite a, #invite button {
      box-sizing: border-box;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 0;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    #invite .primary { background: #2F4FBF; color: #FFFFFF; }
    #invite .secondary { background: rgba(127, 127, 140, 0.14); color: var(--ink); }
    @media (prefers-color-scheme: dark) {
      #invite .primary { background: #4065DD; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <h1>Carden</h1>
    <p>Loading the puzzles</p>
    <div class="bar"></div>
  </div>
  <noscript><p>Carden needs JavaScript to run.</p></noscript>

  <div id="invite" role="dialog" aria-labelledby="invite-title" hidden>
    <div class="card">
      <img src="icons/Icon-192.png" alt="" width="84" height="84">
      <h1 id="invite-title">Play together in Carden</h1>
      <p id="invite-text">You are invited to a shared picture. Open it in the Carden app, or play it here in the browser.</p>
      <a id="invite-app" class="primary" href="https://play.carden.page/">Open in Carden</a>
      <button id="invite-web" class="secondary" type="button">Play in the browser</button>
    </div>
  </div>

  <script>
    // Hide the splash once Flutter has drawn; fall back to a timeout so a
    // missed event never leaves the loader on screen.
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 260);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>
  <script>
    // Trackpad pinch in Safari on a Mac. Chrome and Firefox send a pinch as
    // ctrl+wheel, which Flutter turns into a zoom (giant boards); Safari sends
    // gesture events instead and would zoom the whole page. Each gesture step
    // becomes the ctrl+wheel Flutter expects (scale = exp(-deltaY * dpr / 200)
    // on macOS) at the pointer. Touch screens are left alone: their pinch
    // reaches Flutter as two fingers.
    (function () {
      if (typeof window.GestureEvent === 'undefined' || navigator.maxTouchPoints > 0) return;
      var last = 1, x = 0, y = 0, native = false;
      window.addEventListener('wheel', function (e) { if (e.isTrusted && e.ctrlKey) native = true; }, { capture: true, passive: true });
      window.addEventListener('mousemove', function (e) { x = e.clientX; y = e.clientY; }, { passive: true });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); last = 1; }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
        // A Safari that sends ctrl+wheel itself needs no help.
        if (native) return;
        var ratio = e.scale / last;
        last = e.scale;
        if (!(ratio > 0) || ratio === 1 || !isFinite(ratio)) return;
        var cx = typeof e.clientX === 'number' && e.clientX ? e.clientX : x;
        var cy = typeof e.clientY === 'number' && e.clientY ? e.clientY : y;
        var target = document.elementFromPoint(cx, cy);
        if (!target) return;
        target.dispatchEvent(new WheelEvent('wheel', {
          deltaY: -200 * Math.log(ratio) / (window.devicePixelRatio || 1),
          deltaMode: 0, ctrlKey: true, clientX: cx, clientY: cy,
          bubbles: true, cancelable: true, composed: true,
        }));
      }, { passive: false });
    })();
  </script>
  <script>
    // Starts the game (flutter_bootstrap.js). A Play together invite (/join/<code>) opened on an
    // iPhone or iPad first asks where to play (docs/multiplayer.md): links in Instagram, Snapchat and
    // often Messenger open in the app's own browser, and Safari shows this page whenever the phone's
    // copy of the association file predates /join (iOS refreshes it only on install, update or now and
    // then). "Open in Carden" therefore opens carden://join/<code>, which iOS always hands to the
    // installed app (it asks first); if this page is still on screen a moment later, the app is not
    // there and the card offers the browser and Get Carden instead. The game loads only after "Play in
    // the browser", so an invite opened in the app never takes a seat in the browser as well.
    (function () {
      // Where people get the app (AppLinks.getCarden in lib/core/links.dart): TestFlight until the
      // App Store listing is live (docs/release-checklist.md, "After approval").
      var GET_CARDEN = 'https://testflight.apple.com/join/7nPCfg6A';
      function start() {
        if (window.cardenStarted) return;
        window.cardenStarted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      var m = /^\/join\/([A-Za-z0-9-]{4,20})\/?$/.exec(location.pathname);
      var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!m || !apple) return start();
      var code = m[1].toUpperCase().replace(/[^A-Z0-9]/g, '');
      var invite = document.getElementById('invite');
      var app = document.getElementById('invite-app');
      var web = document.getElementById('invite-web');
      var scheme = 'carden://join/' + code;
      var tried = false;
      // No app here (still on this page after the try): the browser first, then Get Carden.
      function offerBrowser() {
        document.getElementById('invite-title').textContent = 'Play here or get the app';
        document.getElementById('invite-text').textContent = 'If Carden did not open, play right here in the browser, or get the app and open the link again.';
        app.textContent = 'Get Carden';
        app.href = GET_CARDEN;
        app.className = 'secondary';
        web.className = 'primary';
        web.parentNode.insertBefore(web, app);
      }
      app.href = scheme;
      app.addEventListener('click', function (e) {
        if (tried) return;
        e.preventDefault();
        tried = true;
        var left = false;
        function away() { left = true; }
        document.addEventListener('visibilitychange', function () { if (document.hidden) away(); });
        window.addEventListener('pagehide', away);
        location.href = scheme;
        // iOS asks "Open in Carden?" first; give it time before deciding the app is not there.
        setTimeout(function () { if (!left && !document.hidden) offerBrowser(); }, 2500);
      });
      invite.hidden = false;
      document.getElementById('invite-web').addEventListener('click', function () {
        invite.hidden = true;
        start();
      });
    })();
  </script>
</body>
</html>
