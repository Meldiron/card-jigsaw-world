<!doctype html>
<!-- Carden App Store slides in the glass style. tools/store/compose_glass.py fills in __DATA__ and
     __FONT__ and renders one slide per #<number> at 1320 x 2868. The look lives here (glass panes,
     halo, headline, phones, break-out cards, picture rows); the copy and slide list live in the script.
     The panes use the app icon's glass recipe (tools/brand/icon-glass.js): a see-through tinted body,
     a top sheen, a light edge zone, a rim of light, a crisp edge and a tinted shadow; on the white
     canvas the bodies multiply, so overlapping panes mix like stained glass. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Head"; src: url("__FONT__"); font-weight: 100 1000; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
.slide { position: relative; width: 1320px; height: 2868px; overflow: hidden; background: #FFFFFF;
  --ink: #111118; --halo: rgba(255,255,255,.66); --shade: rgba(28,30,60,.22); }
.slide.dark { background: #0A0A10; --ink: #F5F5F8; --halo: rgba(10,10,16,.5); --shade: rgba(0,0,0,.6); }
.world { position: absolute; top: 0; }
.body { mix-blend-mode: multiply; }
.dark .body { mix-blend-mode: normal; filter: brightness(.42) saturate(1.45); }
.dark .top { opacity: .42; }

.halo { position: absolute; left: -120px; right: -120px; border-radius: 50%; background: var(--halo);
  -webkit-backdrop-filter: blur(36px) saturate(1.2); backdrop-filter: blur(36px) saturate(1.2);
  -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); }
h1 { position: absolute; left: 70px; right: 70px; margin: 0; text-align: center; white-space: nowrap;
  font-family: "Head"; font-weight: var(--weight); line-height: 1.06; letter-spacing: var(--track); color: var(--ink); }
.brand { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 24px; }
.brand img { width: 108px; height: 108px; border-radius: 22.37%; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.brand span { font-family: "Head"; font-weight: var(--weight); font-size: 76px; letter-spacing: var(--track); color: var(--ink); }

/* A phone and the cards lifted out of it share one frame, so a tilted phone tilts its cards too. */
.phonebox { position: absolute; transform-origin: 50% 40%; }
.phone { position: absolute; left: 0; top: 0; filter: drop-shadow(0 60px 80px var(--shade)); }
.out { position: absolute; overflow: hidden; box-shadow: 0 46px 90px -24px rgba(20,22,50,.42), 0 0 0 6px rgba(255,255,255,.95); }
.dark .out { box-shadow: 0 46px 90px -24px rgba(0,0,0,.7), 0 0 0 5px rgba(255,255,255,.3); }
.out img { display: block; width: 100%; }
.out b { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 12px 26px; border-radius: 999px;
  background: rgba(255,255,255,.9); font: 600 40px/1 "Head"; color: #111118; white-space: nowrap; }
.pic { position: absolute; object-fit: cover; box-shadow: 0 36px 70px -20px rgba(20,22,50,.38), 0 0 0 6px rgba(255,255,255,.95); }
</style></head><body><div id="root"></div><script>
const S = __DATA__;
const n = +(decodeURIComponent(location.hash.slice(1)) || 1), sl = S.slides[n - 1], W = S.W, H = S.H;
const file = f => S.parts + "/" + f;
document.documentElement.style.setProperty("--weight", S.font.weight);
document.documentElement.style.setProperty("--track", S.font.track + "em");

// ---- glass panes (one panorama; this slide shows its own window of it)
function panesSVG() {
  const defs = [], body = [], top = [];
  S.panes.forEach((p, i) => {
    const t = S.glass[p.c], cx = p.x + p.w / 2, cy = p.y + p.h / 2, rx = p.rx;
    const rot = `rotate(${p.r} ${cx} ${cy})`, rect = a => `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${rx}" ${a}/>`;
    defs.push(`<linearGradient id="b${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.hi}" stop-opacity="${S.body[0]}"/><stop offset="1" stop-color="${t.lo}" stop-opacity="${S.body[1]}"/></linearGradient>`,
      `<linearGradient id="s${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/></linearGradient>`,
      `<linearGradient id="g${i}" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#fff" stop-opacity=".5"/><stop offset=".62" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>`,
      `<clipPath id="c${i}">${rect("")}</clipPath>`);
    // tinted shadow, then the body (multiplied, so overlaps mix like stained glass)
    body.push(`<g transform="${rot}">${rect(`fill="${t.shadow}" opacity="${S.shadow}" filter="url(#blur)" transform="translate(0 70)"`)}</g>`,
      `<g class="body" transform="${rot}">${rect(`fill="url(#b${i})"`)}</g>`);
    // sheen, light edge zone (thickness), rim of light, crisp edge
    top.push(`<g class="top" transform="${rot}">${rect(`fill="url(#s${i})"`)}` +
      `<g clip-path="url(#c${i})">${rect(`fill="none" stroke="${t.edge}" stroke-width="70" opacity=".55" filter="url(#soft)"`)}</g>` +
      rect(`fill="none" stroke="url(#g${i})" stroke-width="7"`) + rect(`fill="none" stroke="${t.line}" stroke-width="2.5" opacity=".42"`) + `</g>`);
  });
  return `<svg class="world" style="left:${-(n - 1) * W}px" width="${W * S.slides.length}" height="${H}" viewBox="0 0 ${W * S.slides.length} ${H}">` +
    `<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55"/></filter>` +
    `<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>${defs.join("")}</defs>` +
    body.join("") + top.join("") + `</svg>`;
}

function render(size) {
  let h = panesSVG();
  const lines = sl.head.split("\n").length, lh = size * 1.06, L = S.layout;
  let headTop, phoneTop;
  if (sl.layout === "B") { phoneTop = L.b_phone_top; headTop = phoneTop + S.phone_h + L.b_gap; }
  else { headTop = sl.brand ? L.a_head_top_brand : L.a_head_top; phoneTop = headTop + lines * lh + L.a_gap; }
  const pics = (sl.pics || []).map(c => `<img class="pic" src="${c.src}" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;border-radius:${c.radius}px;transform:rotate(${c.r}deg)">`).join("");
  h += pics;  // floating covers and picture rows sit behind the halo and the phone
  const haloTop = headTop - (sl.brand ? 230 : 110), haloH = lines * lh + (sl.brand ? 340 : 220);
  h += `<div class="halo" style="top:${haloTop}px;height:${haloH}px"></div>`;
  if (sl.brand) h += `<div class="brand" style="top:${headTop - 190}px"><img src="${S.icon}"><span>Carden</span></div>`;
  h += `<h1 style="top:${headTop}px;font-size:${size}px">${sl.head.replace(/\n/g, "<br>")}</h1>`;
  const tilt = sl.tilt || 0, left = (W - S.phone_w) / 2 + (tilt ? (tilt < 0 ? -40 : 40) : 0);
  const box = (x, y, rot, inner) => `<div class="phonebox" style="left:${x}px;top:${y}px;width:${S.phone_w}px;height:${S.phone_h}px;transform:rotate(${rot}deg)">${inner}</div>`;
  if (sl.second) h += box(left + 250, phoneTop + 140, tilt + 3, `<img class="phone" src="${file(sl.second)}" style="width:${S.phone_w}px">`);
  const outs = (sl.out || []).map(o => `<div class="out" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;border-radius:${o.radius}px;transform:rotate(${o.rot}deg)"><img src="${file(o.img)}">${o.label ? `<b>${o.label}</b>` : ""}</div>`).join("");
  h += box(sl.second ? left - 230 : left, phoneTop, sl.second ? -tilt + 2 : tilt, `<img class="phone" src="${file(sl.phone)}" style="width:${S.phone_w}px">${outs}`);
  document.getElementById("root").innerHTML = `<div class="slide${sl.dark ? " dark" : ""}">${h}</div>`;
}
// One headline size for the set; a slide shrinks only when a line would not fit the measure.
document.fonts.load(`${S.font.weight} ${S.head_size}px Head`).then(() => {
  const c = document.createElement("canvas").getContext("2d"); c.font = `${S.font.weight} ${S.head_size}px Head`;
  const widest = Math.max(...sl.head.split("\n").map(l => c.measureText(l).width * (1 + S.font.track)));
  render(Math.min(S.head_size, Math.floor(S.head_size * S.measure / widest)));
});
</script></body></html>
